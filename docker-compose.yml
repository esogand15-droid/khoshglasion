version: "3.8"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: khoshgelasion
      POSTGRES_USER: khoshgelasion
      POSTGRES_PASSWORD: khoshgelasion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://khoshgelasion:khoshgelasion@db:5432/khoshgelasion
      REDIS_URL: redis://redis:6379/0
volumes:
  pgdata:
