services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: khosh
      POSTGRES_PASSWORD: khosh
      POSTGRES_DB: khoshgelasion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khosh -d khoshgelasion"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8080"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://khosh:khosh@db:5432/khoshgelasion
      APP_ENV: development

volumes:
  pgdata:
