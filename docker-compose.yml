version: "3.8"
services:
  app:
    build: .
    ports:
      - "8000:8080"
    env_file: .env
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/khoshgelasion.db
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      ADMIN_SECRET: ${ADMIN_SECRET:-admin}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-32-chars-minimum-secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret}
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      APP_ENV: ${APP_ENV:-development}
