[project]
name = "khoshgelasion-bot"
version = "1.0.0"
description = "Telegram Channel Content Beautifier Bot - Khoshgelasion"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiogram>=3.7",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
